name: 每日更新 RFI 學習摘要

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 簽出 repo
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝 Node 相依套件
        working-directory: scripts
        run: npm install

      - name: 安裝 ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: 安裝 openai-whisper
        run: pip install -U openai-whisper

      - name: 執行抓取 + 轉錄 + 摘要腳本
        working-directory: scripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-and-summarize.mjs

      - name: 提交更新後的 today.json
        run: |
          git config user.name "rfi-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/today.json
          git diff --staged --quiet && echo "內容沒有變化，略過提交" || git commit -m "每日更新：$(date -u +'%Y-%m-%d')"
          git push
