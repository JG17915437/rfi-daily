name: daily-update

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install-node-deps
        working-directory: scripts
        run: npm install

      - name: install-ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg --fix-missing || \
          sudo apt-get install -y ffmpeg --fix-missing --no-install-recommends
      - name: install-whisper
        run: pip install -U openai-whisper

      - name: run-script
        working-directory: scripts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node fetch-and-summarize.mjs

      - name: commit-results
        run: |
          git config user.name "rfi-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/today.json
          git diff --staged --quiet && echo "no changes" || git commit -m "daily update $(date -u +'%Y-%m-%d')"
          git push
